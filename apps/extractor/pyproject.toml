[project]
name = "whimsync-extractor"
version = "0.1.0"
description = "Whimsync Stage 2 Binary Parser Worker for PDF and Office documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bullmq>=2.6.0",
    "redis>=5.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "google-genai>=1.0.0",
    "pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "boto3>=1.34.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
