name: Lint & Format

on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint-node:
    name: Run Biome Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun & Dependencies
        uses: ./.github/actions/setup-bun

      - name: Run Biome Linter & Formatter Check
        run: bun run lint

  lint-python:
    name: Run Ruff Check (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --directory apps/extractor --extra dev

      - name: Run Ruff Lint Check
        run: uv run --directory apps/extractor ruff check .

      - name: Run Ruff Format Check
        run: uv run --directory apps/extractor ruff format --check .
